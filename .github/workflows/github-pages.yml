name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Build static preview
        env:
          GITHUB_PAGES: "1"
        run: |
          set +e
          npm run build:pages
          BUILD_STATUS=$?
          echo "---- after build (exit $BUILD_STATUS) ----"
          find .output dist public -name "index*" -o -name "*.html" 2>/dev/null | head -80
          ls -la .output/public 2>/dev/null || true
          ls -la dist 2>/dev/null || true
          ls -la dist/client 2>/dev/null || true

          # Nitro sometimes writes a zero-byte file named "index" instead of index.html
          if [ -f .output/public/index ] && [ ! -f .output/public/index.html ]; then
            if [ -s .output/public/index ]; then
              cp .output/public/index .output/public/index.html
            fi
          fi

          HTML=$(find .output dist -name index.html 2>/dev/null | head -1)
          if [ -z "$HTML" ]; then
            echo "No index.html from the builder"
            exit 1
          fi
          DIR=$(dirname "$HTML")
          echo "PUBLISH_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Using $HTML"
          exit 0
      - name: Prepare publish folder
        run: |
          DIR="${PUBLISH_DIR}"
          touch "$DIR/.nojekyll"
          cp "$DIR/index.html" "$DIR/404.html"
          ls -la "$DIR" | head
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
