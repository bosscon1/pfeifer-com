name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Build static preview
        env:
          GITHUB_PAGES: "1"
        run: npm run build:pages
      - name: Prepare publish folder
        run: |
          set -e
          if [ -d dist/client ]; then
            DIR=dist/client
          elif [ -d .output/public ]; then
            DIR=.output/public
          else
            echo "No client build folder"
            ls -la
            exit 1
          fi

          echo "Client folder: $DIR"
          ls -la "$DIR" | head -40

          # Homepage must be the site root, never a nested article folder.
          if [ ! -f "$DIR/index.html" ]; then
            if [ -f "$DIR/index/index.html" ]; then
              cp "$DIR/index/index.html" "$DIR/index.html"
            elif [ -s "$DIR/index" ]; then
              cp "$DIR/index" "$DIR/index.html"
            else
              echo "Missing homepage index.html in $DIR"
              find "$DIR" -name index.html | head -20
              exit 1
            fi
          fi

          # Static files Pages needs next to the built pages
          cp -a public/images "$DIR/" 2>/dev/null || true
          cp -a public/videos "$DIR/" 2>/dev/null || true
          cp -a public/favicon.svg "$DIR/" 2>/dev/null || true
          cp -a public/og.jpg "$DIR/" 2>/dev/null || true

          touch "$DIR/.nojekyll"
          cp "$DIR/index.html" "$DIR/404.html"

          echo "PUBLISH_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Homepage bytes: $(wc -c < "$DIR/index.html")"
          echo "Publish listing:"
          ls "$DIR" | head -50
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
