name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Build static preview
        env:
          GITHUB_PAGES: "1"
        run: |
          set +e
          npm run build:pages
          echo "---- html files after build ----"
          find .output dist public -name "*.html" 2>/dev/null | head -50
          echo "---- dirs ----"
          ls -la .output 2>/dev/null || true
          ls -la .output/public 2>/dev/null || true
          HTML=$(find .output dist -name index.html 2>/dev/null | head -1)
          if [ -n "$HTML" ]; then
            DIR=$(dirname "$HTML")
            echo "FOUND_INDEX=$HTML"
            echo "PUBLISH_DIR=$DIR" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "No index.html found"
          exit 1
      - name: Prepare publish folder
        run: |
          DIR="${PUBLISH_DIR}"
          echo "Using $DIR"
          ls -la "$DIR" | head
          touch "$DIR/.nojekyll"
          cp "$DIR/index.html" "$DIR/404.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
